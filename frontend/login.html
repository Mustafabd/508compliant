<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — 508Compliant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">508<span>Compliant</span></a>
    </div>
  </header>

  <main id="main" class="wrap auth-wrap">
    <section class="auth-card" aria-labelledby="login-heading">
      <h1 id="login-heading">Log in</h1>

      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
      </form>

      <p id="form-status" class="status" role="alert" aria-live="polite"></p>

      <p class="auth-switch">Don't have an account? <a href="/signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    (() => {
      const form = document.getElementById("login-form");
      const statusEl = document.getElementById("form-status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        statusEl.textContent = "";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { ok, data } = await apiJson("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });

        if (!ok) {
          statusEl.setAttribute("data-state", "error");
          statusEl.textContent = (data && data.detail) || "Login failed.";
          return;
        }

        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get("next") || "/app.html";
      });
    })();
  </script>
</body>
</html>
