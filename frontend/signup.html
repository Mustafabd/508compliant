<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — 508Compliant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">508<span>Compliant</span></a>
    </div>
  </header>

  <main id="main" class="wrap auth-wrap">
    <section class="auth-card" aria-labelledby="signup-heading">
      <h1 id="signup-heading">Create your account</h1>
      <p class="auth-subtitle">3 free conversions a month, no credit card required.</p>

      <form id="signup-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <p class="field-hint">At least 8 characters.</p>

        <button type="submit">Sign up</button>
      </form>

      <p id="form-status" class="status" role="alert" aria-live="polite"></p>

      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    (() => {
      const form = document.getElementById("signup-form");
      const statusEl = document.getElementById("form-status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        statusEl.textContent = "";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { ok, data } = await apiJson("/api/auth/signup", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });

        if (!ok) {
          statusEl.setAttribute("data-state", "error");
          statusEl.textContent = (data && data.detail) || "Sign up failed.";
          return;
        }

        window.location.href = "/app.html";
      });
    })();
  </script>
</body>
</html>
